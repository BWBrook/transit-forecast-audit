# Default gitleaks rules plus allowlists for false positives common in research repos.
# [[allowlists]] with targetRules needs gitleaks 8.25 or later; CI pins the version.
[extend]
useDefault = true

[[allowlists]]
description = "Citation style files"
paths = [
  '''(^|/)[^/]*\.csl$''',
]

# Scoped to generic-api-key and matched against the whole line, so the context in
# each pattern counts and format-specific rules (AWS, GitHub, ...) still fire.
[[allowlists]]
description = "Bibliography keys and content digests"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = [
  # CSL-YAML/JSON key lines such as `key: brook2026` or "citation-key": "smith2019",
  # The value must contain a year, so a bare `key: <secret>` line is still reported.
  '''(?i)^\s*(?:-\s+)?["']?(?:citation[-_])?key["']?\s*:\s*["'`]?[A-Za-z][A-Za-z0-9_:.-]*(?:1[5-9]|20)\d{2}[A-Za-z0-9_:.-]*["'`]?\s*,?\s*$''',
  # Hex digests recorded as hashes or checksums
  '''(?i)(sha256|sha1|md5|digest|hash|checksum)[A-Za-z_]*["']?\s*[:=]\s*["'`]?[0-9a-f]{32,64}["'`]?''',
  # Prose citation keys such as "Bibliography key: `GneitingRaftery2007`."
  '''(?i)bibliography key:\s*`[A-Za-z][A-Za-z0-9_:.-]*`''',
]
